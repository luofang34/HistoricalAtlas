[package]
name = "atlas-app"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version = "1.97.1"

[lib]
crate-type = ["rlib", "cdylib"]

[dependencies]
atlas-core.workspace = true
atlas-geo.workspace = true
atlas-ledger.workspace = true
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
tracing.workspace = true
egui = "0.36.2"
egui-wgpu = { version = "0.36.2", features = ["winit"] }
winit = "0.30.13"
web-time = "1.1"
maplibre = { git = "https://github.com/luofang34/maplibre-rs-experimental", rev = "7840c424a277db6278e63c693fa95255ae814cbb", default-features = false, features = ["headless", "geojson", "web-webgl"] }
wgpu = "30"

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
egui-winit = { version = "0.36.2", default-features = false, features = ["x11", "wayland", "links", "clipboard"] }
tokio = { version = "1", features = ["rt-multi-thread"] }
tracing-subscriber.workspace = true

[target.'cfg(target_arch = "wasm32")'.dependencies]
wasm-bindgen = "0.2"
wasm-bindgen-futures = "0.4"
web-sys = { version = "0.3", features = ["HtmlCanvasElement", "Window", "Document", "Element"] }

[dev-dependencies]
atlas-compile = { path = "../../crates/atlas-compile" }
tempfile = "3"

[lints]
workspace = true

