[package]
name = "atlas-app"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true

[lib]
crate-type = ["rlib", "cdylib"]

[dependencies]
atlas-core.workspace = true
atlas-geo.workspace = true
atlas-ledger.workspace = true
atlas-boundary.workspace = true
serde.workspace = true
serde_json.workspace = true
sha2 = "0.10"
thiserror.workspace = true
tracing.workspace = true
url = "2"
async-trait = "0.1"
cgmath = "0.18"
geo = { version = "0.33.1", default-features = false }
rstar = "0.13.1"
egui = "0.36.2"
egui-wgpu = { version = "0.36.2", features = ["winit"] }
winit = "0.30.13"
web-time = "1.1"
maplibre = { git = "https://github.com/luofang34/maplibre-rs-experimental", rev = "03889ee7caecba3b8ca0f18df1204e495acfe0c2", default-features = false, features = ["headless", "geojson", "web-webgl"] }
wgpu = "30"
image = { version = "0.25", default-features = false, features = ["jpeg"] }

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
egui-winit = { version = "0.36.2", default-features = false, features = ["x11", "wayland", "links", "clipboard"] }
tokio = { version = "1", features = ["rt-multi-thread"] }
tracing-subscriber.workspace = true

[target.'cfg(target_arch = "wasm32")'.dependencies]
wasm-bindgen = "0.2"
wasm-bindgen-futures = "0.4"
js-sys = "0.3"
web-sys = { version = "0.3", features = ["HtmlCanvasElement", "Window", "Document", "Element", "Response"] }

[dev-dependencies]
atlas-compile = { path = "../../crates/atlas-compile" }
tempfile = "3"

[lints]
workspace = true

