<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="Historical places, changing names, and their source evidence.">
  <title>Historical Atlas</title>
  <link data-trunk rel="rust" href="Cargo.toml" data-target-name="atlas_app" data-bindgen-target="web" data-wasm-opt="0">
  <link data-trunk rel="copy-file" href="web/loader.mjs">
  <link data-trunk rel="copy-file" href="web/input.mjs">
  <style>
    html, body { width: 100%; height: 100%; margin: 0; background: #152c35; color: #ede4d4; font: 16px system-ui, sans-serif; }
    #atlas { width: 100%; height: 100%; display: block; outline: none; touch-action: none; }
    #status { position: fixed; left: max(20px, env(safe-area-inset-left)); top: max(20px, env(safe-area-inset-top)); padding: 16px; background: #152c35; }
    #status:empty { display: none; }
    #ime { position: fixed; bottom: 0; left: 0; width: 1px; height: 1px; opacity: 0; border: 0; padding: 0; }
  </style>
</head>
<body>
  <canvas id="atlas" tabindex="0" aria-label="Historical Atlas interactive map and evidence browser"></canvas>
  <textarea id="ime" aria-label="Atlas text input" autocapitalize="off" autocomplete="off" spellcheck="false"></textarea>
  <div id="status" role="status">Loading Historical Atlas…</div>
  <script type="module">
    import { loadPublication, loadModule } from './loader.mjs';
    import { connectInput } from './input.mjs';
    const status = document.getElementById('status');
    try {
      const [publication, runtime] = await Promise.all([loadPublication(new URL('./data/', location.href)), loadModule()]);
      const app = runtime.start(document.getElementById('atlas'), JSON.stringify(publication));
      connectInput(app, document.getElementById('atlas'), document.getElementById('ime'));
      status.textContent = '';
    } catch (error) {
      status.textContent = `Unable to open the atlas: ${error.message ?? error}`;
    }
  </script>
</body>
</html>
