name: Deploy

# Publish the browser atlas after CI passes on a push to the default branch, so the site
# always matches a commit whose code and evidence were verified.
on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [atlas-foundation]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

env:
  SOURCE_SHA: ${{ github.event.workflow_run.head_sha || github.sha }}

jobs:
  # CI runs for successive pushes can finish out of order; only the branch tip publishes,
  # so a late result for an older commit never replaces a newer site.
  check:
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event.workflow_run.conclusion == 'success' &&
       github.event.workflow_run.event == 'push')
    runs-on: ubuntu-latest
    outputs:
      current: ${{ steps.tip.outputs.current }}
    steps:
      - id: tip
        run: |
          tip=$(git ls-remote "https://github.com/${GITHUB_REPOSITORY}" refs/heads/atlas-foundation | cut -f1)
          if [ "$tip" = "$SOURCE_SHA" ]; then current=true; else current=false; fi
          echo "tip ${tip}, source ${SOURCE_SHA}, current ${current}"
          echo "current=${current}" >> "$GITHUB_OUTPUT"

  build:
    needs: check
    if: needs.check.outputs.current == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.SOURCE_SHA }}
      - name: Install build tools
        run: |
          rustup toolchain install stable --profile minimal --target wasm32-unknown-unknown
          rustup default stable
          sudo apt-get update
          sudo apt-get install -y protobuf-compiler
          curl -fsSL https://github.com/trunk-rs/trunk/releases/download/v0.21.14/trunk-x86_64-unknown-linux-gnu.tar.gz \
            | sudo tar -xz -C /usr/local/bin trunk
      - uses: Swatinem/rust-cache@v2
      - name: Build the browser atlas
        run: cd apps/atlas-app && trunk build --release
      - name: Keep every published file under 4,000,000 bytes
        run: |
          oversized=$(find dist/site -type f -size +3999999c)
          if [ -n "$oversized" ]; then echo "$oversized"; exit 1; fi
      # Boundary review previews are published only from the gh-pages archive.
      - uses: actions/checkout@v4
        with:
          ref: gh-pages
          path: archive
          sparse-checkout: previews
      - name: Add the review previews
        run: cp -R archive/previews dist/site/previews
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist/site

  deploy:
    needs: build
    concurrency:
      group: pages
      cancel-in-progress: false
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
