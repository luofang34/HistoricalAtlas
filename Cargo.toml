[workspace]
resolver = "3"
members = ["crates/*", "apps/atlas-app", "tools/structure-check"]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "AGPL-3.0-or-later"
rust-version = "1.88"

[workspace.dependencies]
atlas-core = { path = "crates/atlas-core" }
atlas-geo = { path = "crates/atlas-geo" }
atlas-ledger = { path = "crates/atlas-ledger" }
atlas-boundary = { path = "crates/atlas-boundary" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
uuid = { version = "1", features = ["v5", "serde"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

[workspace.lints.rust]
unsafe_code = "forbid"
missing_docs = "deny"
let_underscore_drop = "deny"

[workspace.lints.clippy]
unwrap_used = "forbid"
expect_used = "forbid"
panic = "forbid"
todo = "forbid"
unimplemented = "forbid"
unreachable = "forbid"
exit = "forbid"
mem_forget = "forbid"
get_unwrap = "forbid"
let_underscore_must_use = "deny"
let_underscore_future = "deny"
await_holding_lock = "deny"
indexing_slicing = "deny"
print_stdout = "deny"
print_stderr = "deny"
disallowed_types = "deny"

[profile.release]
lto = "thin"
strip = "debuginfo"
